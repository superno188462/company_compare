[project]
name = "company-screening"
version = "0.1.0"
description = "企业公开线索筛查应用：SDD 与契约骨架阶段"
authors = [
    { name = "西街", email = "947650488@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_screening", "backend"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/company_screening", "backend"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/contracts"]
addopts = "-ra"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "httpx>=0.28.1",
    "jsonschema[format]>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
